[project]
name = "yt-downloader"
version = "1.0.0"
description = "Simple YouTube video, Shorts and audio downloader"
requires-python = ">=3.12"
dependencies = [
    "flet>=1.0",
    "yt-dlp",
    "yt-dlp-ejs",
]

[tool.flet]
product = "YT Downloader"
company = "YT Downloader"
org = "com.ytdownloader"

# Windows only: ffmpeg and Deno are shipped inside the .exe folder through these pip packages.
[tool.flet.windows]
dependencies = ["imageio-ffmpeg", "deno"]

[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.WRITE_EXTERNAL_STORAGE" = true
"android.permission.MANAGE_EXTERNAL_STORAGE" = true
[dependency-groups]
dev = ["flet[all]"]
[tool.flet.app]
path = "src"
